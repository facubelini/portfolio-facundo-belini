<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Facundo Belini</title>
  <meta name="description" content="Portfolio de Facundo Belini — diseño y desarrollo." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,700;0,800;0,900;1,700&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <!-- Papel grain — aria-hidden, puramente decorativo -->
  <div class="grain" aria-hidden="true"></div>

  <header class="site-header">
    <div class="header-left">
      <div id="profile-header-wrap"></div>
      <a href="/" class="site-name">Facundo Belini</a>
    </div>
    <div class="header-right">
      <div id="contact-header-wrap"></div>
      <span class="site-year" id="current-year"></span>
    </div>
  </header>

  <main class="main" id="main">

    <section class="hero" id="hero-section">
      <div class="hero-text">
        <h1 class="hero-title">
          <span class="hero-line1" id="hero-line1">Trabajo</span>
          <em class="hero-line2" id="hero-line2">seleccionado.</em>
        </h1>
        <p class="hero-sub" id="hero-sub">Diseño y desarrollo.</p>
      </div>
      <div class="hero-counter" aria-hidden="true">
        <span class="counter-num" id="project-count">0</span>
        <span class="counter-label">proyectos</span>
      </div>
    </section>

    <!-- About me — oculto si no hay bio; JS lo muestra/llena -->
    <section class="about-section" id="about-section" style="display:none"></section>

    <!-- Servicios — oculto si vacío; JS lo muestra/llena -->
    <section class="services-section" id="services-section" style="display:none"></section>

    <!-- Herramientas — oculto si vacío; JS lo muestra/llena -->
    <section class="tools-section" id="tools-section" style="display:none"></section>

    <!-- Certificaciones — oculto si vacío; JS lo muestra/llena -->
    <section class="certs-section" id="certs-section" style="display:none"></section>

    <div class="projects-header section-header">
      <h2 class="section-title">Mis <em>trabajos</em></h2>
    </div>

    <nav class="filters" aria-label="Filtrar por categoría">
      <div class="filters-inner" id="filters-container">
        <!-- Generado dinámicamente por app.js -->
      </div>
    </nav>

    <section class="projects-section" aria-live="polite" aria-label="Proyectos">
      <div class="projects-grid" id="projects-grid">
        <!-- Generado dinámicamente por app.js -->
      </div>
      <div class="empty-state" id="empty-state" hidden>
        <p class="empty-glyph" aria-hidden="true">○</p>
        <p class="empty-msg">No hay proyectos todavía.</p>
        <p class="empty-hint">Hacé clic en el botón + para agregar el primero.</p>
      </div>
    </section>

  </main>

  <footer class="site-footer">
    <span class="footer-copy">Facundo Belini</span>
    <span class="footer-year" id="footer-year"></span>
  </footer>

  <!-- Botón flotante — siempre visible, pero siempre pide la palabra clave -->
  <button class="fab" id="fab-add" aria-label="Agregar proyecto" title="Agregar proyecto">
    <svg width="18" height="18" viewBox="0 0 18 18" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <line x1="9" y1="2" x2="9" y2="16" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="2" y1="9" x2="16" y2="9" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
    </svg>
  </button>

  <!-- Modal shell — el contenido se inyecta por JS después de verificación -->
  <div id="modal-overlay" class="modal-overlay" aria-hidden="true">
    <div id="modal-box" class="modal-box" role="dialog" aria-modal="true">
      <!-- Contenido inyectado por app.js -->
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
